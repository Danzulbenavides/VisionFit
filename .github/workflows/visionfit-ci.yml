name: VisionFit CI and Security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visionfit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend validation and abuse tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Run input-validation unit tests
        run: npm run --prefix backend test:validation

      - name: Run resource-abuse limiter tests
        run: npm run --prefix backend test:abuse-protection

      - name: Check backend JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find backend/src backend/scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

  web-builds:
    name: ${{ matrix.directory }} lint and build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [admin-web, staff-web]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix "${{ matrix.directory }}"

      - name: Lint
        run: npm run --prefix "${{ matrix.directory }}" lint

      - name: Build production bundle
        run: npm run --prefix "${{ matrix.directory }}" build

  mobile-bundle:
    name: Expo mobile bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install mobile dependencies
        run: npm ci --prefix frontend

      - name: Bundle Android JavaScript
        working-directory: frontend
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/visionfit-expo-export"

  ai-service-check:
    name: Python AI-service dependency and syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install AI-service requirements
        working-directory: ai-service
        run: python -m pip install -r requirements.txt

      - name: Compile and import AI dependencies
        working-directory: ai-service
        run: |
          python -m compileall -q main.py
          python -c "import cv2, fastapi, mediapipe, numpy, uvicorn; print('AI-service imports passed')"

  npm-dependency-audit:
    name: npm audit (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [backend, frontend, admin-web, staff-web]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Audit npm dependencies
        working-directory: ${{ matrix.directory }}
        run: npm audit --audit-level=high

  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install pip-audit
        run: python -m pip install --upgrade pip-audit

      - name: Audit AI-service requirements
        run: pip-audit -r ai-service/requirements.txt
